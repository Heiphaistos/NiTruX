name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev iputils-ping
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx vue-tsc --noEmit
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Les parseurs lisent la sortie réelle des outils de chaque distribution.
  rust-distros:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: Dépendances
        run: |
          case "${{ matrix.image }}" in
            debian*) apt-get update && apt-get install -y build-essential curl git libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev iputils-ping procps iproute2 openssl ca-certificates ;;
            fedora*) dnf install -y gcc gcc-c++ curl git webkit2gtk4.1-devel gtk3-devel librsvg2-devel openssl-devel libxdo-devel iputils procps-ng iproute openssl ca-certificates ;;
            arch*)   pacman -Syu --noconfirm base-devel curl git webkit2gtk-4.1 gtk3 librsvg openssl xdotool iputils procps-ng ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo test
        working-directory: src-tauri

  # Drives the real compiled app (WebDriver), page by page, plus the
  # non-privileged scenarios: terminal, PDF report, benchmark, file tools,
  # drivers. run.sh starts its own Xvfb.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb pciutils
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Selenium
        # Ubuntu's python3-selenium predates the client_config API lib.py uses.
        run: |
          python3 -m venv "$HOME/e2evenv"
          "$HOME/e2evenv/bin/pip" install --quiet selenium==4.51.0
          echo "$HOME/e2evenv/bin" >> "$GITHUB_PATH"
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Application (debug)
        run: npx tauri build --debug --no-bundle
      - name: Parcours de bout en bout
        run: ./e2e/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-captures
          path: e2e/out/
