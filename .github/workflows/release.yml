# Construit et prépare une version à chaque tag vX.Y.Z :
#   1. python3 outils/version.py X.Y.Z, commit, puis git tag vX.Y.Z && git push --tags
#   2. ce workflow construit deb/rpm/AppImage (x86_64 et arm64), le paquet
#      Arch/Omarchy, signe les charges de mise à jour et crée une release
#      GitHub en BROUILLON avec tout dedans, latest.json compris
#   3. relire le brouillon, le publier, puis déposer release/_canal sur le VPS
#      (python3 outils/publier.py depuis la machine qui a la clé SSH)
# Secrets requis : TAURI_SIGNING_PRIVATE_KEY (contenu de nitrux-updater.key)
# et TAURI_SIGNING_PRIVATE_KEY_PASSWORD (vide si la clé n'en a pas).
# Facultatif : NITRUX_GPG_PRIVATE_KEY (clé GPG des dépôts, armure ASCII, sans
# phrase de passe) -- les dépôts apt/rpm/pacman sont alors construits et
# joints en artefact « depot », à envoyer sur le VPS :
#   rsync -a --delete depot/ root@212.227.140.45:/var/www/nitrux-depot/
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Construction signée
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.runner }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/rpm/*.rpm*
            src-tauri/target/release/bundle/appimage/*.AppImage*

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle-ubuntu-22.04
          path: bundle
      - name: Paquet Arch / Omarchy
        run: |
          useradd -m builder
          cp packaging/arch/PKGBUILD bundle/deb/*_amd64.deb /home/builder/
          chown -R builder /home/builder
          su builder -c "cd /home/builder && makepkg -f --nodeps"
          mkdir -p out && cp /home/builder/*.pkg.tar.zst out/
          # Always present, so the artifact keeps out/ and depot-arch/ as
          # top-level folders whether or not the repository is built.
          mkdir -p depot-arch && touch depot-arch/.keep
      - name: Dépôt pacman
        env:
          GPG_KEY: ${{ secrets.NITRUX_GPG_PRIVATE_KEY }}
        if: env.GPG_KEY != ''
        run: |
          pacman -Sy --noconfirm --needed gnupg
          echo "$GPG_KEY" | gpg --batch --import
          export NITRUX_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          NITRUX_DEPOT_OUT=depot-arch bash outils/depot.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            out/*.pkg.tar.zst
            depot-arch/

  release:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: arch
      - name: Manifeste de mise à jour
        run: python3 outils/publier.py --sans-televersement --bundle dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Dépôts apt et rpm
        env:
          GPG_KEY: ${{ secrets.NITRUX_GPG_PRIVATE_KEY }}
        if: env.GPG_KEY != ''
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c
          echo "$GPG_KEY" | gpg --batch --import
          export NITRUX_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          NITRUX_DEPOT_OUT=depot bash outils/depot.sh dist
          [ -d arch/depot-arch/arch ] && cp -r arch/depot-arch/arch depot/
      - uses: actions/upload-artifact@v4
        if: hashFiles('depot/nitrux.asc') != ''
        with:
          name: depot
          path: depot/
      - name: Release GitHub en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "NiTruX ${GITHUB_REF_NAME#v}" \
            --notes "$(python3 -c 'import json;print(json.load(open("release/_canal/latest.json"))["notes"])')" \
            dist/deb/*.deb dist/rpm/*.rpm dist/appimage/*.AppImage arch/out/*.pkg.tar.zst release/_canal/latest.json release/_canal/*.sig
