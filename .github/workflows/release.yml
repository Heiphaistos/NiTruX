# Construit et prépare une version à chaque tag vX.Y.Z :
#   1. python3 outils/version.py X.Y.Z, commit, puis git tag vX.Y.Z && git push --tags
#   2. ce workflow construit deb/rpm/AppImage (x86_64 et arm64), le paquet
#      Arch/Omarchy, signe les charges de mise à jour et crée une release
#      GitHub en BROUILLON avec tout dedans, latest.json compris
#   3. relire le brouillon, le publier, puis déposer release/_canal sur le VPS
#      (python3 outils/publier.py depuis la machine qui a la clé SSH)
# Secrets requis : TAURI_SIGNING_PRIVATE_KEY (contenu de nitrux-updater.key)
# et TAURI_SIGNING_PRIVATE_KEY_PASSWORD (vide si la clé n'en a pas).
# Facultatif : NITRUX_GPG_PRIVATE_KEY (clé GPG des dépôts, armure ASCII, sans
# phrase de passe) -- les dépôts apt/rpm/pacman sont alors construits et
# joints en artefact « depot », à envoyer sur le VPS :
#   rsync -a --delete depot/ root@212.227.140.45:/var/www/nitrux-depot/
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: npm ci
      - name: Construction
        # Without the signing key: the build runs every npm dependency's
        # code, none of which needs it. The packages are signed afterwards,
        # in the release job, by outils/publier.py alone.
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.runner }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/rpm/*.rpm*
            src-tauri/target/release/bundle/appimage/*.AppImage*

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-ubuntu-22.04
          path: bundle
      - name: Paquet Arch / Omarchy
        run: |
          useradd -m builder
          cp packaging/arch/PKGBUILD bundle/deb/*_amd64.deb /home/builder/
          chown -R builder /home/builder
          su builder -c "cd /home/builder && makepkg -f --nodeps"
          mkdir -p out && cp /home/builder/*.pkg.tar.zst out/
          # Always present, so the artifact keeps out/ and depot-arch/ as
          # top-level folders whether or not the repository is built.
          mkdir -p depot-arch && touch depot-arch/.keep
      - name: Dépôt pacman
        env:
          GPG_KEY: ${{ secrets.NITRUX_GPG_PRIVATE_KEY }}
        if: env.GPG_KEY != ''
        run: |
          pacman -Sy --noconfirm --needed gnupg
          echo "$GPG_KEY" | gpg --batch --import
          export NITRUX_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          NITRUX_DEPOT_OUT=depot-arch bash outils/depot.sh out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch
          path: |
            out/*.pkg.tar.zst
            depot-arch/

  release:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch
          path: arch
      - name: Manifeste de mise à jour
        # Without the signing secret the packages still ship on GitHub, but
        # no latest.json is made: the update channel cannot be fed unsigned
        # payloads. Whoever holds the key then runs, on the downloaded
        # packages: python3 outils/publier.py --bundle <dossier>
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: python3 outils/publier.py --sans-televersement --bundle dist
      - name: Dépôts apt et rpm
        env:
          GPG_KEY: ${{ secrets.NITRUX_GPG_PRIVATE_KEY }}
        if: env.GPG_KEY != ''
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c
          echo "$GPG_KEY" | gpg --batch --import
          export NITRUX_GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          NITRUX_DEPOT_OUT=depot bash outils/depot.sh dist
          [ -d arch/depot-arch/arch ] && cp -r arch/depot-arch/arch depot/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('depot/nitrux.asc') != ''
        with:
          name: depot
          path: depot/
      - name: Release GitHub en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # A glob for latest.json too: nullglob only drops patterns, a plain
          # missing name would stay and make gh fail (seen on v0.25.155).
          canal=(release/_canal/latest.jso[n] release/_canal/*.sig)
          notes="$(git log --no-merges --format='- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD | head -n 30)"
          [ ${#canal[@]} -gt 0 ] || notes="$notes

          ⚠️ Paquets non signés pour la mise à jour automatique : signer et envoyer le canal avec outils/publier.py avant de publier."
          gh release create "$GITHUB_REF_NAME" --draft --title "NiTruX ${GITHUB_REF_NAME#v}" --notes "$notes" \
            dist/deb/*.deb dist/rpm/*.rpm dist/appimage/*.AppImage arch/out/*.pkg.tar.zst "${canal[@]}"
